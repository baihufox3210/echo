[project]
name = "echo"
version = "0.1.0"
description = "Discord AI character chat bot with memory and web search"
readme = "README.md"
authors = [
    { name = "baihu", email = "baihu3210@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "openai-agents>=0.22.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
echo-bot = "echo.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
