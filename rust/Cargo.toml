[package]
name = "echo-bot"
version = "0.3.0"
edition = "2024"
description = "Discord AI character chat bot with memory and web search"
license = "MIT"

[[bin]]
name = "echo-bot"
path = "src/main.rs"

[lib]
name = "echo"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
encoding_rs = "0.8.44"
futures-util = "0.3.34"
pdf-extract = "0.12.1"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
strip = true
