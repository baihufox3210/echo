[package]
name = "echo-bot"
version = "0.3.0"
edition = "2024"
description = "Discord AI character chat bot with memory and web search"
license = "MIT"

[[bin]]
name = "echo-bot"
path = "src/main.rs"

[lib]
name = "echo"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
rand = "0.9"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
